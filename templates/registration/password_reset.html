{% extends "base.html" %}
{% block title %}Reset Password - CarePulse{% endblock %}
{% block content %}
<section class="cp-auth-section">
    <div class="container">
        <div class="cp-auth-card">
            <h1>Forgot Your Password?</h1>
            <p>Enter your email address below, and we'll email you instructions to reset your password.</p>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Send Reset Email</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
