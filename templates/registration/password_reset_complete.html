{% extends "base.html" %}
{% block title %}Password Reset Complete - CarePulse{% endblock %}
{% block content %}
<section class="cp-auth-section">
    <div class="container">
        <div class="cp-auth-card">
            <h1>Password Reset Complete</h1>
            <p>Your password has been set successfully. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary" style="display:inline-block; margin-top:1rem; text-decoration:none;">Log In</a>
        </div>
    </div>
</section>
{% endblock %}
